name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: collab template lint
        run: python3 scripts/check_collab_turn_templates.py

      - name: benchmark methodology lint
        run: python3 scripts/check_benchmark_methodology.py

      - name: benchmark methodology guard self-test
        run: python3 scripts/test_check_benchmark_methodology.py

      - name: collab baseline self-test
        run: python3 scripts/test_collab_baseline.py -v

      # This compares two committed, deterministic JSON artifacts. It does not
      # start ironmem, load the embedder, call a model, or require network access.
      - name: collab baseline regression check
        run: >-
          python3 scripts/collab_baseline.py check
          --baseline docs/BENCHMARKS/collab-baseline.json
          --report docs/BENCHMARKS/fixtures/issue-212-reference-report.json

      - name: site/README drift guard self-test
        run: python3 scripts/test_check_site_readme_sync.py

      - name: release notes extractor self-test
        run: python3 scripts/test_release_notes.py

      # Two pytest suites need this install. The git hook runner self-test is
      # pytest because its parametrized cases are derived from the GATES
      # manifest, so it cannot be plain unittest; the collab turn-template
      # suite is pytest by construction. Every other Python self-test above is
      # stdlib-only and needs no install step.
      - name: install pytest
        run: python3 -m pip install --break-system-packages pytest

      - name: git hook runner self-test
        run: python3 scripts/test_run_git_hook.py

      # Distinct from the "collab template lint" step above: that runs the
      # linter, this runs the linter's own test suite. It went unrun -- and
      # therefore silently red -- from adb5c80 until it was wired in here.
      #
      # Targets `tests/`, not the one package inside it. A second package added
      # later is then covered automatically; naming the package would recreate
      # the same silently-unrun suite one directory over. Matches the command
      # in CONTRIBUTING.md's local loop exactly, flags included.
      - name: python test suites
        run: python3 -m pytest tests/

      - name: installer self-test
        run: python3 scripts/test_install_ironmem.py

      - name: ultrareview workflow self-test
        run: node scripts/test_ultrareview_workflow.mjs

      - name: MCP wrapper drift check
        run: python3 scripts/sync_mcp_wrappers.py --check

      - name: skills sync drift check
        run: python3 scripts/check_skills_sync.py

      - name: skills generator self-test
        run: python3 scripts/test_sync_skills.py

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      # Workaround for the Homebrew rustup-init shim on macos-latest:
      # the runner image keeps a `cargo`/`rustc` symlink at a PATH
      # entry ahead of `~/.cargo/bin`, and the precedence is
      # *non-deterministic across runner images* — `GITHUB_PATH`
      # prepend works on some runs and not others. Two layers of defense:
      #   1. `rustup default stable` makes the rustup config consistent.
      #   2. The cargo steps run `rustup run stable cargo …`, so PATH
      #      precedence is irrelevant for the immediate invocation.
      #      Never an absolute `$HOME/.cargo/bin/cargo`: an image whose
      #      rustup comes from Homebrew skips the `~/.cargo` install, and
      #      that path then does not exist.
      # We also still prepend `$HOME/.cargo/bin` to GITHUB_PATH so any
      # child processes cargo spawns (rustc -vV, build scripts, etc.)
      # find the real toolchain first when they inherit PATH.
      - name: Force stable toolchain default + prepend cargo bin to PATH (macOS rustup-init shim workaround)
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # macOS Xcode rotation can remove the selected Xcode's clang compiler-rt,
      # breaking `clang_rt.osx` linking. Pin a present, validated Xcode. (#171)
      - name: Pin a present Xcode toolchain (macOS clang_rt.osx linker fix, #171)
        if: runner.os == 'macOS'
        uses: ./.github/actions/pin-xcode

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo test
        run: "rustup run stable cargo test --workspace"

      - name: cargo build ironmem binary for smoke/artifact
        if: runner.os == 'Linux'
        run: "rustup run stable cargo build -p ironmem --bin ironmem"

      - name: Live initialize smoke test
        if: runner.os == 'Linux'
        run: python3 scripts/mcp_smoke_test.py --binary ./target/debug/ironmem

      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ironmem-linux
          path: target/debug/ironmem

      # `cargo test --workspace` above builds without `headroom-compression`,
      # so it never runs the compressor, and the `--all-features` clippy in
      # `check` only compiles it. The compressed body is not ours: it comes
      # from the `headroom-core` git revision pinned in
      # crates/ironmem/Cargo.toml. Moving that pin from 5bd2266f to 74b7ac23
      # changed the body (hunks split and renumbered as context is trimmed)
      # and no step in this workflow ran the compressor to notice. The
      # integration target asserts the exact hunk headers the feature build
      # renders for its wide fixtures, and the body lines and expansions it
      # checks beside them, so a pin move fails here only when it changes
      # output one of those assertions covers; a change to compressor output
      # that no test asserts still passes. The unit target runs the
      # hunk-tagging tests in the same build.
      #
      # Two steps, so each command reports its own exit status. Only the
      # review-diff tests, not `--all-features` over the workspace: the
      # feature gates no other code. Last in the job, after the smoke
      # test and upload, so `target/debug/ironmem` is the default-feature
      # binary whenever those steps read it. Cost: the feature build compiles
      # `headroom-core`, tree-sitter and eight grammar crates on each runner.
      - name: cargo test review-diff unit tests (headroom-compression)
        run: "rustup run stable cargo test -p ironmem --features headroom-compression --lib review_diff"

      - name: cargo test review-diff integration tests (headroom-compression)
        run: "rustup run stable cargo test -p ironmem --features headroom-compression --test review_diff"

  build:
    name: Build Binary (macos-latest)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      # See the cargo test step in the `test` job for why we call
      # cargo through `rustup run stable` on macOS.
      - name: Force stable toolchain default + prepend cargo bin to PATH (macOS rustup-init shim workaround)
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # See the same step in the `test` job — macOS Xcode rotation breaks
      # `clang_rt.osx` linking; pin a present Xcode. (#171)
      - name: Pin a present Xcode toolchain (macOS clang_rt.osx linker fix, #171)
        if: runner.os == 'macOS'
        uses: ./.github/actions/pin-xcode

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo build
        run: "rustup run stable cargo build -p ironmem --bin ironmem"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ironmem-macos
          path: target/debug/ironmem

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The step above reads only the root Cargo.lock. The benchmark crates
      # are separate Cargo workspaces (excluded in the root Cargo.toml), each
      # with its own tracked lockfile, so nothing audited them:
      # benchmarks/provbench/labeler and phase1 carried RUSTSEC-2025-0140
      # (`gix-date`) and RUSTSEC-2025-0021 (`gix-features`) on `gix` 0.66
      # until someone ran `cargo audit` on them by hand.
      #
      # One step per lockfile. `working-directory` only picks the lockfile:
      # the action runs `cargo audit --json --file <working-directory>/Cargo.lock`
      # from the repository root, so the ignore list in .cargo/audit.toml
      # applies to these runs too. The one id it hides in them is
      # RUSTSEC-2024-0436 (`paste`, a proc-macro) in provbench/baseline,
      # phase1 and scoring; abeval and labeler report nothing without it.
      - name: audit benchmarks/abeval lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: benchmarks/abeval

      - name: audit benchmarks/provbench/baseline lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: benchmarks/provbench/baseline

      - name: audit benchmarks/provbench/labeler lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: benchmarks/provbench/labeler

      - name: audit benchmarks/provbench/phase1 lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: benchmarks/provbench/phase1

      - name: audit benchmarks/provbench/scoring lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: benchmarks/provbench/scoring

  package:
    name: Package Dry-Run
    runs-on: ubuntu-24.04
    needs: [check, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      # `ironmem`'s optional `headroom-compression` feature depends on an
      # unpublished git crate, so Cargo cannot verify its registry archive.
      # Continue archive verification for every publishable workspace crate.
      - name: cargo package publishable workspace crates
        run: cargo package --workspace --exclude ironmem

  plugin-metadata:
    name: Plugin Metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          for f in .codex-plugin/plugin.json .codex-plugin/hooks.json \
                   .claude-plugin/plugin.json .claude-plugin/.mcp.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Check version consistency
        run: bash scripts/check_versions.sh

  docs-sync:
    name: Site/README Drift Guard
    # PR-only: the guard diffs the PR head against its base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Need the base branch history to diff the change set against it.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Warn-only by default: drift is reported as a non-blocking annotation
      # and the step still passes. To make it a hard merge gate, add --strict
      # to the python command below (the one-line config change).
      - name: site/README drift guard
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Ensure the base ref is present (checkout fetch-depth:0 normally
          # provides origin/<base>, but fetch explicitly as a fallback so the
          # guard never silently diffs against a missing ref).
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null \
            || git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python3 scripts/check_site_readme_sync.py --base "origin/${BASE_REF}"

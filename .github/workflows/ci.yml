name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: collab template lint
        run: python3 scripts/check_collab_turn_templates.py

      - name: benchmark methodology lint
        run: python3 scripts/check_benchmark_methodology.py

      - name: benchmark methodology guard self-test
        run: python3 scripts/test_check_benchmark_methodology.py

      - name: site/README drift guard self-test
        run: python3 scripts/test_check_site_readme_sync.py

      - name: git hook runner self-test
        run: python3 scripts/test_run_git_hook.py

      - name: MCP wrapper drift check
        run: python3 scripts/sync_mcp_wrappers.py --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      # Workaround for the Homebrew rustup-init shim on macos-latest:
      # the runner image keeps a `cargo`/`rustc` symlink at a PATH
      # entry ahead of `~/.cargo/bin`, and the precedence is
      # *non-deterministic across runner images* — `GITHUB_PATH`
      # prepend works on some runs and not others. Two layers of defense:
      #   1. `rustup default stable` makes the rustup config consistent.
      #   2. The `cargo test` step calls cargo by absolute path
      #      (`$HOME/.cargo/bin/cargo`) so PATH precedence is
      #      irrelevant for the immediate invocation.
      # We also still prepend `$HOME/.cargo/bin` to GITHUB_PATH so any
      # child processes cargo spawns (rustc -vV, build scripts, etc.)
      # find the real toolchain first when they inherit PATH.
      - name: Force stable toolchain default + prepend cargo bin to PATH (macOS rustup-init shim workaround)
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # macOS Xcode rotation can remove the selected Xcode's clang compiler-rt,
      # breaking `clang_rt.osx` linking. Pin a present, validated Xcode. (#171)
      - name: Pin a present Xcode toolchain (macOS clang_rt.osx linker fix, #171)
        if: runner.os == 'macOS'
        uses: ./.github/actions/pin-xcode

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo test
        run: "$HOME/.cargo/bin/cargo test --workspace"

      - name: cargo build ironmem binary for smoke/artifact
        if: runner.os == 'Linux'
        run: "$HOME/.cargo/bin/cargo build -p ironmem --bin ironmem"

      - name: Live initialize smoke test
        if: runner.os == 'Linux'
        run: python3 scripts/mcp_smoke_test.py --binary ./target/debug/ironmem

      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ironmem-linux
          path: target/debug/ironmem

  build:
    name: Build Binary (macos-latest)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      # See the cargo test step in the `test` job for why we call
      # cargo by absolute path on macOS.
      - name: Force stable toolchain default + prepend cargo bin to PATH (macOS rustup-init shim workaround)
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # See the same step in the `test` job — macOS Xcode rotation breaks
      # `clang_rt.osx` linking; pin a present Xcode. (#171)
      - name: Pin a present Xcode toolchain (macOS clang_rt.osx linker fix, #171)
        if: runner.os == 'macOS'
        uses: ./.github/actions/pin-xcode

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo build
        run: "$HOME/.cargo/bin/cargo build -p ironmem --bin ironmem"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ironmem-macos
          path: target/debug/ironmem

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package Dry-Run
    runs-on: ubuntu-24.04
    needs: [check, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo package workspace
        run: cargo package --workspace

  plugin-metadata:
    name: Plugin Metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          for f in .codex-plugin/plugin.json .codex-plugin/hooks.json \
                   .claude-plugin/plugin.json .claude-plugin/.mcp.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Check version consistency
        run: bash scripts/check_versions.sh

  docs-sync:
    name: Site/README Drift Guard
    # PR-only: the guard diffs the PR head against its base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Need the base branch history to diff the change set against it.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Warn-only by default: drift is reported as a non-blocking annotation
      # and the step still passes. To make it a hard merge gate, add --strict
      # to the python command below (the one-line config change).
      - name: site/README drift guard
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Ensure the base ref is present (checkout fetch-depth:0 normally
          # provides origin/<base>, but fetch explicitly as a fallback so the
          # guard never silently diffs against a missing ref).
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null \
            || git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python3 scripts/check_site_readme_sync.py --base "origin/${BASE_REF}"

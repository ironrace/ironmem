[package]
name = "abeval"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[[bin]]
name = "abeval"
path = "src/main.rs"

[lib]
name = "abeval"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

# Standalone workspace root. The repo root's `workspace.exclude` already keeps
# this package out of the main workspace, but that exclusion is path-relative to
# the root checkout: inside a `git worktree` under `.worktrees/`, cargo walks up,
# finds the root manifest, and refuses to build ("current package believes it's
# in a workspace when it's not"). Declaring the empty table here makes the
# package its own workspace root — matching its committed Cargo.lock — so it
# builds identically from the main checkout and from any worktree.
[workspace]

[package]
name = "abeval"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[[bin]]
name = "abeval"
path = "src/main.rs"

[lib]
name = "abeval"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

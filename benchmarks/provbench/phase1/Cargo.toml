[package]
name = "provbench-phase1"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Phase 1 rules-based structural invalidator for ProvBench (SPEC §8 candidate)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "provbench-phase1"
path = "src/main.rs"

[lib]
name = "provbench_phase1"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
# Used in Task 3+: structural runner instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gix = { version = "0.66", default-features = false, features = ["max-performance-safe"] }
# Used in Task 3+: R5 whitespace/comment-only and R6 doc-claim parsers
# v1.4: tree-sitter + tree-sitter-python pinned to labeler crate's versions
# (bf56f40) to avoid parser-state mismatch (design §9 risk #6).
tree-sitter = "0.25"
tree-sitter-rust = "0.21"
tree-sitter-md = "0.2"
tree-sitter-python = "0.25"
provbench-scoring = { path = "../scoring" }

[dev-dependencies]
tempfile = "3"

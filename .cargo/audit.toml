# cargo-audit ignore list.
#
# These are advisories that remain after updating the lockfile.
# Each entry documents the actual reason we accept the risk today and what
# condition should trigger removal from this list.

[advisories]

# bincode 1.3.3 — pulled in transitively by hnsw_rs (= 0.3.4).
# We only use hnsw_rs for in-memory graph construction/search. This repo does
# not call any hnsw_rs dump/load APIs or otherwise deserialize bincode payloads
# from users, disk, or the network, so the practical exposure is much lower
# than the generic advisory text implies. Revisit when hnsw_rs upgrades.
ignore = [
    # RUSTSEC-2025-0141 — bincode is unmaintained.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2025-0119 — number_prefix is unmaintained.
    # Only used transitively through hf-hub's progress UI.
    "RUSTSEC-2025-0119",
    # RUSTSEC-2024-0436 — paste is unmaintained.
    # Only used as a proc-macro dependency; no runtime surface. The workspace
    # lockfile has it under tokenizers. CI also audits the benchmark lockfiles
    # with this list, and benchmarks/provbench/{scoring,baseline,phase1} have
    # the same proc-macro under simba (statrs -> nalgebra -> simba).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0543 — chrono is unmaintained (not a vulnerability).
    # Direct dependency in crates/ironmem and benchmarks/abeval. Remove in the
    # PR that migrates off chrono to jiff or time (#440).
    "RUSTSEC-2026-0543",
    # RUSTSEC-2026-0574 to -0582 — nine "unsound" reports on heapless 0.8.0
    # (not vulnerabilities). Only in the benchmarks/provbench/{labeler,phase1}
    # lockfiles, under gix 0.77 -> gix-hash -> faster-hex 0.10.1. faster-hex
    # imports heapless only without its `alloc` feature, and gix-hash turns
    # that feature on (through `std`), so no heapless code is called. No
    # 0.8.x release fixes them; the fix is heapless >= 0.9.4. Remove in the
    # PR that moves those two benchmarks to a gix without faster-hex 0.10
    # (#451).
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]

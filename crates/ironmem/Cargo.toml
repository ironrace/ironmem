[package]
name = "ironmem"
version = "0.5.0"
edition = "2021"
rust-version.workspace = true
description = "AI memory MCP server — semantic search + knowledge graph in a single binary"
license = "Apache-2.0"
authors = ["Jeffrey Crum <jeffrey.crum81@gmail.com>"]
repository = "https://github.com/ironrace/ironmem"
homepage = "https://github.com/ironrace/ironmem"
keywords = ["memory", "mcp", "semantic-search", "knowledge-graph", "ai"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"
exclude = [
    "benches/",
]

[lib]
name = "ironmem"
path = "src/lib.rs"

[[bin]]
name = "ironmem"
path = "src/main.rs"

[features]
default = []
headroom-compression = ["dep:headroom-core"]

[dependencies]
ironrace-core = { version = "0.3.4", path = "../ironrace-core" }
ironrace-embed = { version = "0.3.4", path = "../ironrace-embed" }
ironrace-pref-extract = { version = "0.3.4", path = "../ironrace-pref-extract" }
ironrace-rerank = { version = "0.4.0", path = "../ironrace-rerank" }
headroom-core = { git = "https://github.com/headroomlabs-ai/headroom.git", rev = "5bd2266f16bb351a7a7334e1c29c598d28187b1d", package = "headroom-core", default-features = false, optional = true }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "signal", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

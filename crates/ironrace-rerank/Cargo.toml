[package]
name = "ironrace-rerank"
version = "0.3.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LLM-based reranker for ironrace-memory."
authors = ["Jeffrey Crum <jeffrey.crum81@gmail.com>"]
repository = "https://github.com/ironrace/ironmem"
homepage = "https://github.com/ironrace/ironmem"
keywords = ["rerank", "llm", "memory", "mcp", "search"]
categories = ["algorithms"]
readme = "../../README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
